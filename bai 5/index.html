<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style</title>
    <link rel ="stylesheet" href="style.css">
    <style>
        h2{
            color: pink;
            background-color: black
        }
    </style>
    <style>
         .khoi-1{
            background-color: green;
        }
         
        .khoi-2{
            background-color: blue;
            margin: 10px 50px 100px 200px;
            /* margin truyền một giá trị thì sẽ cách xung quanh = giá trị đó */
            /* 2 giá trị: giá trị đầu (trên dưới), giá trị thứ 2 (trái phải) */
            /* 4 giá trị: thứ tự trên phải dưới trái */
        }
         
        .khoi-3{
            background-color: yellow;
            padding: 30px 40px 80px 90px;
            /* 4 giá trị: giá trị đầu(trên), thứ 2 (phải), thứ 3 (dưới), thứ 4 (trái) */
            /* 2 giá trị: giá trị đầu (trên dưới), giá trị thứ 2 (trái phải) */
        }
    </style>
</head>
<body>
    <!-- cách1: Inline style -->
   <h1 style="color: yellow; background-color: black">Đỗ Thị Tuyết Mai</h1>

    <!-- cách2: Internal style -->
   <h2>Đỗ Thị Tuyết Mai</h2>

    <!-- cách3: External style -->
   <h3>Đỗ Thị Tuyết Mai</h3>

    <!-- cách 4:trỏ đến các thuộc tính: id or class -->
     <!-- id sử dụng dấu # +tên id -->
   <h4 id="tieude-1">web2</h4>
     <!-- class sử dụng dấu . +tên class -->
   <h5 class="tieude-2">web3</h5>
   
   <!-- element.class:kết hợp thẻ + tên class -->
   <div>web 4</div> <!-- không hiện màu và nền vì thiếu class="web4" để trỏ đến thuộc tính trong file style.css-->
   <div class="web4">web 4</div>

   <div class="khoi-1">Khối 1</div>
   <div class="khoi-2">Khối 2</div>
   <div class="khoi-3">Khối 3</div>
   
</body>
</html>
