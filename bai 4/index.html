<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style</title>
    <style>
        h2{
            color: pink;
            background-color: black
        }
        h3{
            color: white;
            background-color: green
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- cách 1: Inline style 
    color: quy định màu chữ; background-color: quy định màu nền -->
    <h1 style="color: blue; background-color: orange"> Bài STYLE</h1>

    <!-- cách 2: Internal style -->
    <h2 style="color: green">Cách 2 Internal style</h2>
    <h3>Đỗ Thị Tuyết Mai</h3>
    <!-- nếu ghi style vào dòng thì sẽ ưu tiên dòng hơn ở đầu vì nó đè lên màu cũ -->
    
    <!-- cách 3: External style -->
    <h4>Cách 3: External style</h4>
</body>
</html>
