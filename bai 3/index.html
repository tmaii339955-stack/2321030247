<html>
    <head>
        <title> bai 3 web </title>
    </head>
    <body>
        <MARQuEE>
            <img src="../ảnh/pm.jpg">
        </MARQuEE>
       <!-- ol Danh sách có thứ tự -->
        <ol>
            <li>C#</li>
            <li>Python</li>
            <li>JavaScript</li>
        </ol>
       <!-- danh sách không thứ tự -->
        <ul>
            <li>C#</li>
            <li>Python</li>
            <li>JavaScript</li>
        </ul>
        

        <h1>From đăng ký</h1>
        <form>
            <div>
                <b>Họ và tên</b><br>
                <!-- nếu input không có type thì mặc định là text -->
                <input type="text" placeholder="Họ và tên">
            </div>
            <div>
                <b>Năm sinh</b><br>
                <input type="number" placeholder="Năm sinh">
            </div>
            <!-- thuộc tính readonly sử dụng khi không muốn người dùng nhập thông tin vào input -->
            <div>
                <b>Mật khẩu</b><br>
                <input type="password" placeholder="Mật khẩu">
            </div>
            <div>
                <b>Giới thiệu về bản thân</b><br>
                <textarea>Nhập thông tin...</textarea>
            </div>
            <div>
                <b>Email</b><br>
                <input type="email">
            </div>
            <!-- số đầu tiên: 0
            số thứ hai: 3,9,8
            8 số thứ ba: 0-9 -->
            <div>
                <b>Số điện thoại</b><br>
                <input type="tel" pattern="([0]{1}([3,9,8]{1})([0-9]{8}))">
            </div>
            <div>
                <b>Giới tính</b><br>
                <input type="radio" name="gioitinh" value="Nam"> Nam <br>
                <input type="radio" name="gioitinh" value="Nữ"> Nữ 
                <!-- chỗ giới tính nếu nhập gender thì sẽ chọn cả nam và nữ  -->
            </div>
            <div>
                <b>Sở thích</b><br>
                Chơi game: <input type="checkbox" name="sothich" value="choigame"> <br>
                Nghe nhạc: <input type="checkbox" name="sothich" value="nghenhac"> <br>
                Thể thao: <input type="checkbox" name="sothich" value="thethao"> <br>
            </div>  
            <div>
                <b>Trình duyệt web tôi thích</b><br>
                <select name="browser">
                    <option value="Internet Explorer">Internet Explorer</option>
                    <option value="Cốc cốc">Cốc cốc</option>
                    <option value="Firefox">Firefox</option>
                    <option value="Safari">Safari</option>
                    <option value="Chrome">Chrome</option>
                    <option value="Opera">Opera</option>
                </select>
            </div>
            <!-- 0 <input type="range" id="a" value="50">100  --> 
            <div>
                <input type="submit"><br>
                <button>Xác nhận</button>
                <input type="reset">
            </div>
        </form>
        
        <iframe width="560" height="315" width="560" height="315" src="https://www.youtube.com/embed/45WMF8iJafw?si=c7OBrI8D0flICiJM"></iframe>

        <div>
            <video controls width="560" height="315">
               <source src="/ảnh/bff.mp4" type="video/mp4">
            </video>
            
            <audio controls>
                <source src="/ảnh/audio1.mp4" type="audio/mpeg">
            </audio>
        </div>
       
    </body>
</html>
